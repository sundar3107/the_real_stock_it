services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock_management_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_FILE=/app/data/stock_management.db
      - JWT_SECRET=scm_stock_management_jwt_production_secret_key_2026
      - JWT_EXPIRES_IN=24h
      - BCRYPT_SALT_ROUNDS=10
      - CORS_ORIGIN=http://localhost:3000,http://localhost:5173
    volumes:
      - stock_data:/app/data
    ports:
      - "5000:5000"
    networks:
      - stock_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stock_management_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - stock_network

volumes:
  stock_data:
    driver: local

networks:
  stock_network:
    driver: bridge
